name: CI

on:
  push:
  pull_request:

jobs:
  # Composer installs the newest PHPUnit allowed by the PHP version: 10.5 on
  # PHP 8.1, 11.5 on 8.2, 12 on 8.3 and 13 from 8.4 on.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: extractions/setup-just@v4
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: just check-ci

  # composer.json allows every Mago 1.x from its lowest version on. The other
  # jobs install the newest one, and this job checks the lowest.
  lowest-mago:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: extractions/setup-just@v4
      # The repository doesn't have a lock file, so the first update writes one,
      # and the second one moves Mago alone down to its lowest version.
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer update carthage-software/mago --prefer-lowest --no-interaction --no-progress --prefer-dist
      - run: just check-lowest
